[project]
name = "landscout-ai"
version = "0.1.0"
description = "LandScout AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.1.4",
    "pandas>=3.0,<4",
    "py7zr>=1.1.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyogrio>=0.13.0",
    "pypdf>=6.15.0",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "requests>=2.32,<3",
    "shapely>=2.1.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "landscout"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
